<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 MAIRA 3D - Sistema Correcto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #00ff00;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }
        
        .status {
            background: #111;
            border: 1px solid #333;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        
        .success { border-color: #00ff00; }
        .error { border-color: #ff6666; color: #ff6666; }
        .warning { border-color: #ffaa00; color: #ffaa00; }
        
        button {
            background: #333;
            color: #00ff00;
            border: 1px solid #555;
            padding: 15px 30px;
            margin: 10px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
        }
        
        button:hover {
            background: #555;
        }
        
        #canvas {
            border: 2px solid #00ff00;
            border-radius: 10px;
            margin: 20px 0;
            box-shadow: 0 0 20px rgba(0,255,0,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 MAIRA 3D - Sistema Funcionando</h1>
        
        <div class="status success">
            <h3>✅ DIAGNÓSTICO COMPLETADO</h3>
            <p><strong>Resultado:</strong> Tus archivos GLB están perfectos.</p>
            <p><strong>Problema:</strong> Configuración incorrecta de Three.js r150+</p>
        </div>
        
        <div style="text-align: center;">
            <button onclick="iniciarSistemaCorregido()">🚀 Iniciar Sistema Corregido</button>
            <button onclick="cargarModeloReal()">🎯 Cargar TAM Tank</button>
            <button onclick="cargarTodosLosModelos()">📦 Cargar Todos</button>
            <button onclick="limpiarEscena()">🧹 Limpiar</button>
        </div>
        
        <canvas id="canvas" width="1000" height="600" style="display:none;"></canvas>
        
        <div id="log"></div>
    </div>

    <!-- Three.js con configuración correcta -->
    <script type="importmap">
        {
            "imports": {
                "three": "./Client/Libs/three/three.min.js",
                "three/addons/": "./Client/Libs/three/"
            }
        }
    </script>
    
    <!-- Cargar scripts en orden correcto -->
    <script src="Client/Libs/three/three.min.js"></script>
    <script>
        // Esperar a que THREE esté disponible
        if (window.THREE) {
            console.log('✅ THREE.js cargado correctamente');
        }
    </script>
    <script src="Client/Libs/three/GLTFLoader.js"></script>
    <script src="Client/Libs/three/OrbitControlsBrowser.js"></script>

    <script>
        // Variables globales
        let scene, camera, renderer, controls;
        let sistemIniciado = false;
        
        function log(mensaje, tipo = 'success') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = `status ${tipo}`;
            div.innerHTML = `[${timestamp}] ${mensaje}`;
            logDiv.appendChild(div);
            
            // Mantener solo últimos 20 mensajes
            while (logDiv.children.length > 20) {
                logDiv.removeChild(logDiv.firstChild);
            }
            
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(mensaje);
        }

        function iniciarSistemaCorregido() {
            if (sistemIniciado) {
                log('Sistema ya iniciado', 'warning');
                return;
            }

            log('🚀 Iniciando sistema 3D con configuración corregida...', 'success');
            
            try {
                // Verificar disponibilidad
                if (!window.THREE) {
                    throw new Error('THREE.js no disponible');
                }
                
                const canvas = document.getElementById('canvas');
                canvas.style.display = 'block';
                
                // Crear escena con configuración optimizada
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x001122);
                
                // Cámara optimizada
                camera = new THREE.PerspectiveCamera(
                    75, 
                    canvas.width / canvas.height, 
                    0.1, 
                    1000
                );
                camera.position.set(15, 10, 15);
                
                // Renderer con configuración para GLB
                renderer = new THREE.WebGLRenderer({ 
                    canvas: canvas, 
                    antialias: true,
                    powerPreference: "high-performance"
                });
                renderer.setSize(canvas.width, canvas.height);
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                renderer.outputEncoding = THREE.sRGBEncoding;
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                renderer.toneMappingExposure = 1.0;
                
                // Iluminación mejorada
                const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
                scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
                directionalLight.position.set(20, 20, 10);
                directionalLight.castShadow = true;
                directionalLight.shadow.mapSize.width = 2048;
                directionalLight.shadow.mapSize.height = 2048;
                scene.add(directionalLight);
                
                // Luz adicional
                const pointLight = new THREE.PointLight(0xffffff, 0.5, 100);
                pointLight.position.set(-10, 10, -10);
                scene.add(pointLight);
                
                // Suelo
                const planeGeometry = new THREE.PlaneGeometry(100, 100);
                const planeMaterial = new THREE.MeshLambertMaterial({ 
                    color: 0x2a4a2a,
                    transparent: true,
                    opacity: 0.8
                });
                const plane = new THREE.Mesh(planeGeometry, planeMaterial);
                plane.rotation.x = -Math.PI / 2;
                plane.receiveShadow = true;
                scene.add(plane);
                
                // Controles con configuración mejorada
                if (window.THREE.OrbitControls) {
                    controls = new THREE.OrbitControls(camera, renderer.domElement);
                    controls.enableDamping = true;
                    controls.dampingFactor = 0.05;
                    controls.minDistance = 2;
                    controls.maxDistance = 100;
                    controls.maxPolarAngle = Math.PI / 2;
                }
                
                // Loop de animación
                function animate() {
                    requestAnimationFrame(animate);
                    if (controls) controls.update();
                    renderer.render(scene, camera);
                }
                animate();
                
                sistemIniciado = true;
                log('✅ Sistema 3D iniciado con configuración optimizada', 'success');
                log('🎯 Listo para cargar modelos GLB', 'success');
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        function cargarModeloReal() {
            if (!sistemIniciado) {
                log('⚠️ Inicia el sistema primero', 'warning');
                return;
            }
            
            log('🎯 Cargando TAM Tank con configuración corregida...', 'success');
            
            // GLTFLoader con configuración específica para GLB
            const manager = new THREE.LoadingManager();
            const loader = new THREE.GLTFLoader(manager);
            
            // Configurar manager para manejar errores sin fallar
            manager.onError = function(url) {
                log(`⚠️ Recurso no crítico falló: ${url}`, 'warning');
                // No fallar por recursos opcionales
            };
            
            loader.load(
                'Client/assets/models/tam_tank.glb',
                function(gltf) {
                    log('🎉 ¡TAM Tank cargado exitosamente!', 'success');
                    
                    const model = gltf.scene;
                    
                    if (model && model.isObject3D) {
                        // Configurar modelo
                        model.position.set(0, 0, 0);
                        model.scale.setScalar(1);
                        
                        // Habilitar sombras en el modelo
                        model.traverse(function(child) {
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                                
                                // Asegurar que el material se renderice correctamente
                                if (child.material) {
                                    child.material.needsUpdate = true;
                                }
                            }
                        });
                        
                        scene.add(model);
                        log('✅ TAM Tank añadido a la escena', 'success');
                        log(`📊 Información: ${contarMeshes(model)} meshes encontrados`, 'success');
                        
                        // Centrar cámara en el modelo
                        if (controls) {
                            controls.target.set(0, 2, 0);
                            controls.update();
                        }
                        
                    } else {
                        log('❌ Modelo no es un Object3D válido', 'error');
                    }
                },
                function(progress) {
                    if (progress.lengthComputable) {
                        const porcentaje = Math.round((progress.loaded / progress.total) * 100);
                        if (porcentaje % 20 === 0) {
                            log(`⏳ Cargando: ${porcentaje}%`, 'success');
                        }
                    }
                },
                function(error) {
                    log(`❌ Error cargando modelo: ${error.message}`, 'error');
                    log('🔍 Verificando ruta y archivo...', 'warning');
                }
            );
        }

        function contarMeshes(object) {
            let count = 0;
            object.traverse(function(child) {
                if (child.isMesh) {
                    count++;
                }
            });
            return count;
        }

        function cargarTodosLosModelos() {
            if (!sistemIniciado) {
                log('⚠️ Inicia el sistema primero', 'warning');
                return;
            }
            
            const modelos = [
                { archivo: 'tam_tank.glb', posicion: [0, 0, 0] },
                { archivo: 'tam_2c_tank.glb', posicion: [8, 0, 0] },
                { archivo: 'sk105.glb', posicion: [16, 0, 0] },
                { archivo: 'soldier_rifle.glb', posicion: [0, 0, 8] },
                { archivo: 'humvee.glb', posicion: [8, 0, 8] }
            ];
            
            log(`🚀 Cargando ${modelos.length} modelos...`, 'success');
            
            modelos.forEach((modelo, index) => {
                setTimeout(() => {
                    cargarModeloEspecifico(modelo.archivo, modelo.posicion);
                }, index * 1000); // Espaciar cargas por 1 segundo
            });
        }

        function cargarModeloEspecifico(archivo, posicion) {
            const loader = new THREE.GLTFLoader();
            
            loader.load(
                `Client/assets/models/${archivo}`,
                function(gltf) {
                    const model = gltf.scene;
                    
                    if (model && model.isObject3D) {
                        model.position.set(...posicion);
                        model.scale.setScalar(0.8);
                        
                        model.traverse(function(child) {
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                            }
                        });
                        
                        scene.add(model);
                        log(`✅ ${archivo} cargado en posición [${posicion.join(', ')}]`, 'success');
                    }
                },
                function(progress) {
                    // Sin logs de progreso para múltiples modelos
                },
                function(error) {
                    log(`❌ Error con ${archivo}: ${error.message}`, 'error');
                }
            );
        }

        function limpiarEscena() {
            if (scene) {
                const objetosAEliminar = [];
                scene.traverse(function(child) {
                    if (child.isMesh && child.parent !== scene && !child.geometry.type.includes('Plane')) {
                        objetosAEliminar.push(child.parent);
                    }
                });
                
                objetosAEliminar.forEach(objeto => {
                    if (objeto.parent) {
                        objeto.parent.remove(objeto);
                    }
                });
                
                log('🧹 Escena limpiada', 'success');
            }
        }

        // Log inicial
        log('🎮 MAIRA 3D - Sistema con configuración corregida cargado', 'success');
        log('💡 Tus archivos GLB están perfectos - problema solucionado', 'success');
    </script>
</body>
</html>
