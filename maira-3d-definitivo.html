<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 MAIRA 3D - SOLUCIÓN DEFINITIVA</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #000428, #004e92);
            color: #00ff00;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff;
            font-size: 2.5em;
            margin-bottom: 30px;
        }
        
        .status-panel {
            background: rgba(0,0,0,0.8);
            border: 2px solid #00ff00;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,255,0,0.3);
        }
        
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        
        button {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 15px 20px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        
        button:hover {
            background: linear-gradient(145deg, #00ff00, #00cc00);
            color: #000;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,255,0,0.4);
        }
        
        button:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        #canvas {
            border: 3px solid #00ff00;
            border-radius: 15px;
            margin: 20px 0;
            box-shadow: 0 0 30px rgba(0,255,0,0.5);
            background: #001122;
        }
        
        .log-panel {
            background: rgba(0,0,0,0.9);
            border: 1px solid #333;
            padding: 15px;
            height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .success { color: #00ff00; }
        .error { color: #ff6666; }
        .warning { color: #ffaa00; }
        .info { color: #00aaff; }
        
        .model-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        
        .model-card {
            background: rgba(0,0,0,0.7);
            border: 2px solid #333;
            padding: 15px;
            border-radius: 10px;
            transition: all 0.3s;
        }
        
        .model-card:hover {
            border-color: #00ff00;
            box-shadow: 0 0 15px rgba(0,255,0,0.3);
        }
        
        .model-card h3 {
            color: #00ffff;
            margin-top: 0;
        }
        
        .status-indicator {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .status-placeholder { background: #004400; color: #88ff88; }
        .status-loading { background: #444400; color: #ffff88; }
        .status-error { background: #440000; color: #ff8888; }
        .status-success { background: #004400; color: #88ff88; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 MAIRA 3D - SOLUCIÓN DEFINITIVA</h1>
        
        <div class="status-panel">
            <h3>🔧 Estado del Sistema</h3>
            <p id="systemStatus">Sistema listo para inicializar...</p>
        </div>
        
        <div class="controls">
            <button onclick="iniciarSistema()" id="btnInit">🚀 Inicializar Sistema</button>
            <button onclick="crearPlaceholders()" id="btnPlaceholders" disabled>📦 Crear Placeholders</button>
            <button onclick="intentarCargaReal()" id="btnReal" disabled>🎯 Intentar Carga Real</button>
            <button onclick="ajustarIluminacion()" id="btnLuz" disabled>💡 Mejorar Iluminación</button>
            <button onclick="limpiarEscena()" id="btnClear" disabled>🧹 Limpiar Escena</button>
            <button onclick="mostrarEstadisticas()" id="btnStats" disabled>📊 Estadísticas</button>
        </div>
        
        <canvas id="canvas" width="1000" height="600" style="display:none;"></canvas>
        
        <div class="log-panel" id="logPanel"></div>
        
        <div class="model-grid" id="modelGrid" style="display:none;"></div>
    </div>

    <!-- Three.js MODERNO -->
    <script src="Client/Libs/three/three.min.js"></script>
    <script src="Client/Libs/three/GLTFLoader.js"></script>
    <script src="Client/Libs/three/OrbitControlsBrowser.js"></script>

    <script>
        // Variables globales
        let scene, camera, renderer, controls;
        let sistemActivo = false;
        let modelosCargados = 0;
        let totalModelos = 0;
        
        // Lista de modelos MAIRA
        const modelosMAIRA = [
            { nombre: 'TAM Tank', archivo: 'tam_tank.glb', tipo: 'Tanque Pesado', color: 0x4a6a4a },
            { nombre: 'TAM 2C', archivo: 'tam_2c_tank.glb', tipo: 'Tanque Medio', color: 0x5a7a5a },
            { nombre: 'SK105', archivo: 'sk105.glb', tipo: 'Cañón Autopropulsado', color: 0x6a5a4a },
            { nombre: 'Soldado Rifle', archivo: 'soldier_rifle.glb', tipo: 'Infantería', color: 0x4a5a6a },
            { nombre: 'Humvee', archivo: 'humvee.glb', tipo: 'Vehículo Táctico', color: 0x5a4a3a }
        ];

        function log(mensaje, tipo = 'info') {
            const panel = document.getElementById('logPanel');
            const timestamp = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = tipo;
            div.innerHTML = `[${timestamp}] ${mensaje}`;
            panel.appendChild(div);
            panel.scrollTop = panel.scrollHeight;
            
            // Mantener solo 50 mensajes
            while (panel.children.length > 50) {
                panel.removeChild(panel.children[0]);
            }
        }

        function actualizarEstado(mensaje, tipo = '') {
            const status = document.getElementById('systemStatus');
            status.innerHTML = mensaje;
            status.className = tipo;
        }

        function iniciarSistema() {
            log('🚀 Inicializando Sistema MAIRA 3D...', 'info');
            actualizarEstado('Inicializando...', 'warning');
            
            try {
                // Verificar dependencias
                if (!window.THREE) {
                    throw new Error('THREE.js no disponible');
                }
                
                log('✅ THREE.js detectado correctamente', 'success');
                
                // Configurar canvas
                const canvas = document.getElementById('canvas');
                canvas.style.display = 'block';
                
                // Crear escena con configuración optimizada
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x001133);
                
                // Configurar cámara
                camera = new THREE.PerspectiveCamera(
                    75, 
                    canvas.width / canvas.height, 
                    0.1, 
                    1000
                );
                camera.position.set(15, 10, 15);
                
                // Crear renderer con configuración moderna
                renderer = new THREE.WebGLRenderer({ 
                    canvas: canvas, 
                    antialias: true,
                    alpha: false,
                    powerPreference: "high-performance"
                });
                
                renderer.setSize(canvas.width, canvas.height);
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                renderer.outputColorSpace = THREE.SRGBColorSpace; // Corregido para r150+
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                renderer.toneMappingExposure = 1.2;
                
                log('✅ Renderer configurado con optimizaciones', 'success');
                
                // Configurar iluminación MEJORADA
                configurarIluminacion();
                
                // Crear suelo
                crearSuelo();
                
                // Configurar controles
                if (window.THREE.OrbitControls) {
                    controls = new THREE.OrbitControls(camera, renderer.domElement);
                    controls.enableDamping = true;
                    controls.dampingFactor = 0.05;
                    controls.screenSpacePanning = false;
                    controls.minDistance = 5;
                    controls.maxDistance = 100;
                    controls.maxPolarAngle = Math.PI / 2;
                    
                    log('✅ Controles OrbitControls configurados', 'success');
                }
                
                // Iniciar loop de renderizado
                iniciarAnimacion();
                
                sistemActivo = true;
                actualizarEstado('✅ Sistema 3D activo y funcionando', 'success');
                log('🎉 Sistema MAIRA 3D inicializado correctamente', 'success');
                
                // Habilitar botones
                document.getElementById('btnPlaceholders').disabled = false;
                document.getElementById('btnReal').disabled = false;
                document.getElementById('btnLuz').disabled = false;
                document.getElementById('btnClear').disabled = false;
                document.getElementById('btnStats').disabled = false;
                
            } catch (error) {
                log(`❌ Error inicializando: ${error.message}`, 'error');
                actualizarEstado('❌ Error en inicialización', 'error');
            }
        }

        function configurarIluminacion() {
            // Luz ambiental más brillante
            const ambientLight = new THREE.AmbientLight(0x404040, 1.0); // Aumentado de 0.6 a 1.0
            scene.add(ambientLight);
            
            // Luz direccional principal más intensa
            const mainLight = new THREE.DirectionalLight(0xffffff, 1.5); // Aumentado de 0.8 a 1.5
            mainLight.position.set(20, 20, 10);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            mainLight.shadow.camera.near = 0.5;
            mainLight.shadow.camera.far = 50;
            scene.add(mainLight);
            
            // Luz de relleno desde otro ángulo
            const fillLight = new THREE.DirectionalLight(0x8888ff, 0.8);
            fillLight.position.set(-10, 15, -10);
            scene.add(fillLight);
            
            // Luz puntual para destacar modelos
            const spotLight = new THREE.SpotLight(0xffffff, 2.0);
            spotLight.position.set(0, 20, 0);
            spotLight.angle = Math.PI / 4;
            spotLight.penumbra = 0.3;
            spotLight.decay = 1;
            spotLight.distance = 50;
            spotLight.castShadow = true;
            scene.add(spotLight);
            
            log('💡 Iluminación mejorada configurada', 'success');
        }

        function crearSuelo() {
            const planeGeometry = new THREE.PlaneGeometry(100, 100);
            const planeMaterial = new THREE.MeshLambertMaterial({ 
                color: 0x2a4a2a,
                transparent: true,
                opacity: 0.8
            });
            const plane = new THREE.Mesh(planeGeometry, planeMaterial);
            plane.rotation.x = -Math.PI / 2;
            plane.receiveShadow = true;
            plane.name = 'suelo';
            scene.add(plane);
            
            // Agregar líneas de grilla
            const gridHelper = new THREE.GridHelper(100, 20, 0x00ff00, 0x004400);
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);
            
            log('🏁 Suelo y grilla creados', 'success');
        }

        function iniciarAnimacion() {
            function animate() {
                requestAnimationFrame(animate);
                
                if (controls) {
                    controls.update();
                }
                
                // Rotación suave de modelos
                scene.traverse(function(child) {
                    if (child.isMesh && child.name.startsWith('modelo_')) {
                        child.rotation.y += 0.005; // Rotación lenta
                    }
                });
                
                renderer.render(scene, camera);
            }
            animate();
            
            log('🎬 Loop de animación iniciado', 'success');
        }

        function crearPlaceholders() {
            if (!sistemActivo) {
                log('⚠️ Sistema no iniciado', 'warning');
                return;
            }
            
            log('📦 Creando placeholders para modelos...', 'info');
            
            // Limpiar modelos existentes
            limpiarModelos();
            
            modelosMAIRA.forEach((modelo, index) => {
                const placeholder = crearPlaceholderPorTipo(modelo, index);
                scene.add(placeholder);
                
                log(`📦 ${modelo.nombre} - Placeholder creado`, 'success');
            });
            
            mostrarGridModelos('placeholder');
            log('✅ Todos los placeholders creados', 'success');
        }

        function crearPlaceholderPorTipo(modelo, index) {
            let geometry;
            
            switch (modelo.tipo) {
                case 'Tanque Pesado':
                case 'Tanque Medio':
                    geometry = new THREE.BoxGeometry(4, 2, 3);
                    break;
                case 'Cañón Autopropulsado':
                    geometry = new THREE.BoxGeometry(3.5, 1.8, 2.5);
                    break;
                case 'Vehículo Táctico':
                    geometry = new THREE.BoxGeometry(3, 1.5, 2);
                    break;
                case 'Infantería':
                    geometry = new THREE.CapsuleGeometry(0.4, 1.8, 4, 8);
                    break;
                default:
                    geometry = new THREE.BoxGeometry(2, 1, 2);
            }
            
            const material = new THREE.MeshPhongMaterial({ 
                color: modelo.color,
                transparent: true,
                opacity: 0.8,
                shininess: 100
            });
            
            const placeholder = new THREE.Mesh(geometry, material);
            
            // Posicionamiento en grilla
            const fila = Math.floor(index / 3);
            const columna = index % 3;
            
            placeholder.position.set(
                (columna - 1) * 8,
                modelo.tipo === 'Infantería' ? 0.9 : 1,
                (fila - 1) * 8
            );
            
            placeholder.castShadow = true;
            placeholder.receiveShadow = true;
            placeholder.name = `modelo_${modelo.nombre.replace(/\s+/g, '_')}`;
            
            return placeholder;
        }

        function intentarCargaReal() {
            if (!sistemActivo) {
                log('⚠️ Sistema no iniciado', 'warning');
                return;
            }
            
            log('🎯 Intentando carga de modelos reales con GLTFLoader...', 'info');
            totalModelos = modelosMAIRA.length;
            modelosCargados = 0;
            
            modelosMAIRA.forEach((modelo, index) => {
                cargarModeloConManejadorDeMejorado(modelo, index);
            });
        }

        function cargarModeloConManejadorDeMejorado(modelo, index) {
            const loader = new THREE.GLTFLoader();
            const rutaModelo = `Client/assets/models/${modelo.archivo}`;
            
            log(`🔄 Intentando cargar: ${modelo.nombre}...`, 'info');
            
            // Configurar manager para manejar errores
            const manager = new THREE.LoadingManager();
            const loaderConManager = new THREE.GLTFLoader(manager);
            
            manager.onError = function(url) {
                log(`⚠️ Error del manager: ${url}`, 'warning');
            };
            
            loaderConManager.load(
                rutaModelo,
                function(gltf) {
                    // SUCCESS - Modelo cargado
                    log(`🎉 ¡${modelo.nombre} cargado exitosamente!`, 'success');
                    
                    try {
                        if (gltf.scene && gltf.scene.isObject3D) {
                            // Limpiar placeholder existente
                            const placeholderExistente = scene.getObjectByName(`modelo_${modelo.nombre.replace(/\s+/g, '_')}`);
                            if (placeholderExistente) {
                                scene.remove(placeholderExistente);
                            }
                            
                            // Configurar modelo real
                            const modeloReal = gltf.scene;
                            
                            // Posicionamiento
                            const fila = Math.floor(index / 3);
                            const columna = index % 3;
                            modeloReal.position.set(
                                (columna - 1) * 8,
                                0,
                                (fila - 1) * 8
                            );
                            
                            // Escalado apropiado
                            modeloReal.scale.setScalar(0.8);
                            
                            // Configurar sombras
                            modeloReal.traverse(function(child) {
                                if (child.isMesh) {
                                    child.castShadow = true;
                                    child.receiveShadow = true;
                                    
                                    // Mejorar materiales
                                    if (child.material) {
                                        child.material.needsUpdate = true;
                                    }
                                }
                            });
                            
                            modeloReal.name = `modelo_${modelo.nombre.replace(/\s+/g, '_')}`;
                            scene.add(modeloReal);
                            
                            modelosCargados++;
                            log(`✅ ${modelo.nombre} añadido a la escena (${modelosCargados}/${totalModelos})`, 'success');
                            
                            if (modelosCargados === totalModelos) {
                                log('🎉 ¡TODOS LOS MODELOS CARGADOS EXITOSAMENTE!', 'success');
                                actualizarEstado('🎉 Todos los modelos reales activos', 'success');
                            }
                            
                        } else {
                            throw new Error('gltf.scene no es válido');
                        }
                        
                    } catch (processError) {
                        log(`❌ Error procesando ${modelo.nombre}: ${processError.message}`, 'error');
                        // Mantener placeholder en caso de error
                    }
                },
                function(progress) {
                    if (progress.lengthComputable) {
                        const porcentaje = Math.round((progress.loaded / progress.total) * 100);
                        if (porcentaje % 25 === 0) {
                            log(`⏳ ${modelo.nombre}: ${porcentaje}%`, 'info');
                        }
                    }
                },
                function(error) {
                    // ERROR - Mantener placeholder
                    log(`❌ ${modelo.nombre} falló: ${error.message}`, 'error');
                    log(`💡 Manteniendo placeholder para ${modelo.nombre}`, 'warning');
                    
                    // El placeholder ya existe, no hacemos nada
                    modelosCargados++;
                    
                    if (modelosCargados === totalModelos) {
                        log('⚠️ Carga completada con algunos errores', 'warning');
                        actualizarEstado('⚠️ Sistema mixto: placeholders + modelos reales', 'warning');
                    }
                }
            );
        }

        function ajustarIluminacion() {
            if (!sistemActivo) return;
            
            log('💡 Ajustando iluminación...', 'info');
            
            // Incrementar intensidad de todas las luces
            scene.traverse(function(child) {
                if (child.isLight) {
                    child.intensity *= 1.5;
                }
            });
            
            // Agregar luz adicional si es necesario
            const extraLight = new THREE.HemisphereLight(0x8888ff, 0x444444, 1.0);
            scene.add(extraLight);
            
            log('✅ Iluminación mejorada', 'success');
        }

        function limpiarEscena() {
            if (!scene) return;
            
            limpiarModelos();
            document.getElementById('modelGrid').style.display = 'none';
            log('🧹 Escena limpiada', 'success');
        }

        function limpiarModelos() {
            const objetosAEliminar = [];
            scene.traverse(function(child) {
                if (child.isMesh && child.name.startsWith('modelo_')) {
                    objetosAEliminar.push(child);
                }
            });
            
            objetosAEliminar.forEach(objeto => {
                scene.remove(objeto);
                if (objeto.geometry) objeto.geometry.dispose();
                if (objeto.material) {
                    if (Array.isArray(objeto.material)) {
                        objeto.material.forEach(mat => mat.dispose());
                    } else {
                        objeto.material.dispose();
                    }
                }
            });
        }

        function mostrarGridModelos(tipo) {
            const grid = document.getElementById('modelGrid');
            grid.style.display = 'grid';
            grid.innerHTML = '';
            
            modelosMAIRA.forEach(modelo => {
                const card = document.createElement('div');
                card.className = 'model-card';
                card.innerHTML = `
                    <h3>${modelo.nombre}</h3>
                    <p><strong>Tipo:</strong> ${modelo.tipo}</p>
                    <p><strong>Archivo:</strong> ${modelo.archivo}</p>
                    <div class="status-indicator status-${tipo}">
                        ${tipo === 'placeholder' ? '📦 Placeholder Activo' : '🎮 Modelo Real'}
                    </div>
                    <button onclick="enfocarModelo('${modelo.nombre}')">🎯 Enfocar</button>
                `;
                grid.appendChild(card);
            });
        }

        function enfocarModelo(nombreModelo) {
            if (!scene || !camera || !controls) return;
            
            const nombreObjeto = `modelo_${nombreModelo.replace(/\s+/g, '_')}`;
            const objeto = scene.getObjectByName(nombreObjeto);
            
            if (objeto) {
                const position = objeto.position.clone();
                camera.position.set(position.x + 8, position.y + 5, position.z + 8);
                if (controls) {
                    controls.target.copy(position);
                    controls.update();
                }
                log(`🎯 Enfocando ${nombreModelo}`, 'success');
            } else {
                log(`⚠️ No se encontró ${nombreModelo}`, 'warning');
            }
        }

        function mostrarEstadisticas() {
            if (!scene) return;
            
            let contadores = {
                meshes: 0,
                luces: 0,
                materiales: 0,
                geometrias: 0,
                modelos: 0
            };
            
            scene.traverse(function(child) {
                if (child.isMesh) {
                    contadores.meshes++;
                    if (child.name.startsWith('modelo_')) {
                        contadores.modelos++;
                    }
                }
                if (child.isLight) {
                    contadores.luces++;
                }
            });
            
            log('📊 ESTADÍSTICAS DE LA ESCENA:', 'info');
            log(`   🎮 Modelos: ${contadores.modelos}`, 'info');
            log(`   🔺 Meshes: ${contadores.meshes}`, 'info');
            log(`   💡 Luces: ${contadores.luces}`, 'info');
            log(`   🎯 Sistema: ${sistemActivo ? 'ACTIVO' : 'INACTIVO'}`, sistemActivo ? 'success' : 'error');
        }

        // Logs iniciales
        log('🎮 MAIRA 3D - Sistema Definitivo cargado', 'success');
        log('💡 Presiona "Inicializar Sistema" para comenzar', 'info');
        log('📋 Este sistema maneja errores GLB y mejora la iluminación', 'info');
    </script>
</body>
</html>
