<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Tareas del Proyecto</title>
    <link rel="stylesheet" href="tasks.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <header class="main-header">
        <h1><i class="fa-solid fa-diagram-project"></i> Tablero de Tareas: Control de Stock</h1>
    </header>

    <main class="task-board">
        <div class="board-column" data-status="planned">
            <div class="column-header">
                <h2><i class="fa-solid fa-list-check"></i> Tareas Planeadas</h2>
                <span class="task-count">0</span>
                <button class="add-task-btn" id="addTaskBtn" title="Añadir nueva tarea"><i
                        class="fa-solid fa-plus"></i></button>
            </div>
            <div class="column-content">
                <!-- Las tareas se insertarán aquí -->
            </div>
        </div>

        <div class="board-column" data-status="in_progress">
            <div class="column-header">
                <h2><i class="fa-solid fa-person-digging"></i> En Progreso</h2>
                <span class="task-count">0</span>
            </div>
            <div class="column-content">
                <!-- Las tareas se insertarán aquí -->
            </div>
        </div>

        <div class="board-column" data-status="completed">
            <div class="column-header">
                <h2><i class="fa-solid fa-flag-checkered"></i> Terminadas</h2>
                <span class="task-count">0</span>
            </div>
            <div class="column-content">
                <!-- Las tareas se insertarán aquí -->
            </div>
        </div>

        <div class="board-column" data-status="undefined">
            <div class="column-header">
                <h2><i class="fa-solid fa-circle-question"></i> Testing</h2>
                <span class="task-count">0</span>
            </div>
            <div class="column-content">
                <!-- Las tareas se insertarán aquí -->
            </div>
        </div>

        <div class="board-column" data-status="ready">
            <div class="column-header">
                <h2><i class="fa-solid fa-check-double"></i> Tarea Lista</h2>
                <span class="task-count">0</span>
            </div>
            <div class="column-content">
                <!-- Las tareas se insertarán aquí -->
            </div>
        </div>
    </main>

    <!-- Modal para Crear Tarea -->
    <div id="createTaskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Crear Nueva Tarea</h2>
                <button class="modal-close" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="createTaskForm">
                    <div class="form-group">
                        <label for="taskTitle">Título de la Tarea</label>
                        <input type="text" id="taskTitle" name="title" required
                            placeholder="Ej: Diseñar la página de inicio">
                    </div>
                    <div class="form-group">
                        <label for="taskDeveloper">Asignar a Desarrollador</label>
                        <select id="taskDeveloper" name="developer">
                            <option value="">-- No asignar --</option>
                            <option value="JOSE">Jose</option>
                            <option value="COLO">Colo</option>
                            <option value="RUSO">Ruso</option>
                            <option value="WALTER">Walter</option>
                            <option value="FRANCO">Franco</option>
                        </select>
                    </div>
                    <button type="submit" class="submit-btn">Crear Tarea</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal para Detalles de Tarea -->
    <div id="taskDetailsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="detailsTaskTitle">Detalles de la Tarea</h2>
                <button class="modal-close" id="closeDetailsModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="taskDetailsForm">
                    <input type="hidden" id="detailsTaskId" name="taskId">
                    <div class="form-group">
                        <label for="taskNotes">Descripción / Observaciones</label>
                        <textarea id="taskNotes" name="notes" rows="6"
                            placeholder="Añade una descripción o notas para esta tarea..."></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Guardar Cambios</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const addTaskBtn = document.getElementById('addTaskBtn');
            const createModal = document.getElementById('createTaskModal');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const createTaskForm = document.getElementById('createTaskForm');

            const detailsModal = document.getElementById('taskDetailsModal');
            const closeDetailsModalBtn = document.getElementById('closeDetailsModalBtn');
            const taskDetailsForm = document.getElementById('taskDetailsForm');

            let allTasks = []; // Para acceder a los datos de las tareas fácilmente

            function createTaskCard(task) {
                const card = document.createElement('div');
                card.className = 'task-card';
                card.setAttribute('data-id', task.id);
                card.draggable = true;
                const developers = ['JOSE', 'COLO', 'RUSO', 'WALTER', 'FRANCO'];

                card.addEventListener('dragstart', () => {
                    card.classList.add('dragging');
                });

                card.addEventListener('dragend', () => {
                    card.classList.remove('dragging');
                });

                // Abrir modal de detalles al hacer click en la tarjeta
                card.addEventListener('click', (e) => {
                    console.log('Card clicked. Target:', e.target);
                    // Evitar abrir si se hizo clic en un botón de acción
                    if (e.target.closest('button, .assign-menu')) {
                        console.log('Click was on an action button, ignoring for modal.');
                        return;
                    }

                    console.log(`Searching for task with id: ${task.id}`);
                    const taskData = allTasks.find(t => t.id == task.id);
                    console.log('Found task data:', taskData);

                    if (taskData) {
                        document.getElementById('detailsTaskTitle').textContent = taskData.title;
                        document.getElementById('detailsTaskId').value = taskData.id;
                        document.getElementById('taskNotes').value = taskData.notes || '';
                        detailsModal.style.display = 'block';
                        console.log('Displaying details modal.');
                    } else {
                        console.error('Could not find task data in allTasks array for id:', task.id);
                    }
                });

                const assignedUsersContainer = document.createElement('div');
                assignedUsersContainer.className = 'assigned-users';

                const updateAssignedUsers = (assignedList) => {
                    assignedUsersContainer.innerHTML = '';
                    if (assignedList && assignedList.length > 0) {
                        assignedList.forEach(user => {
                            const avatar = document.createElement('span');
                            avatar.className = 'user-avatar';
                            avatar.title = user;
                            avatar.textContent = user.substring(0, 2).toUpperCase();
                            assignedUsersContainer.appendChild(avatar);
                        });
                    }
                };

                updateAssignedUsers(task.assigned_to);

                let subtasksHTML = '';
                if (task.subtasks && task.subtasks.length > 0) {
                    subtasksHTML = `<div class="subtasks">
                         <h4>Subtareas:</h4>
                         <ul>
                             ${task.subtasks.map(sub => `<li class="subtask-${sub.status}">${sub.title}</li>`).join('')}
                         </ul>
                     </div>`;
                }

                let notesHTML = '';
                if (task.notes) {
                    notesHTML = `<div class="task-notes"><i class="fa-solid fa-thumbtack"></i> ${task.notes}</div>`;
                }

                const assignMenuHTML = `
                    <div class="assign-menu">
                        <div class="assign-menu-header">Asignar a:</div>
                        <ul>
                            ${developers.map(dev => `<li data-developer="${dev}">${dev}</li>`).join('')}
                        </ul>
                        <div class="assign-menu-footer">
                            <button class="unassign-btn" data-developer="NONE">Quitar todos</button>
                        </div>
                    </div>
                `;

                card.innerHTML = `
                     <div class="card-header">
                         <h3 class="task-title">${task.title}</h3>
                         <div class="card-actions">
                             <!-- El contenedor de avatares se insertará aquí -->
                             <button class="assign-user-btn" title="Asignar desarrollador"><i class="fa-solid fa-user-plus"></i></button>
                             <button class="delete-task-btn" title="Eliminar tarea"><i class="fa-solid fa-trash-can"></i></button>
                             ${assignMenuHTML}
                         </div>
                     </div>
                     ${subtasksHTML}
                     ${notesHTML}
                 `;

                card.querySelector('.card-actions').insertBefore(assignedUsersContainer, card.querySelector('.assign-user-btn'));

                // Lógica para el menú de asignación
                const assignBtn = card.querySelector('.assign-user-btn');
                const assignMenu = card.querySelector('.assign-menu');

                assignBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    assignMenu.classList.toggle('visible');
                });

                document.addEventListener('click', (e) => {
                    if (!card.contains(e.target)) {
                        assignMenu.classList.remove('visible');
                    }
                });

                assignMenu.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const target = e.target.closest('li, .unassign-btn');
                    if (target) {
                        const developer = target.getAttribute('data-developer');
                        const taskId = card.getAttribute('data-id');

                        fetch('assign_task.php', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ taskId, developer })
                        })
                            .then(response => response.json())
                            .then(data => {
                                if (data.success && data.task) {
                                    updateAssignedUsers(data.task.assigned_to);
                                }
                                else {
                                    alert('Error al asignar la tarea: ' + data.message);
                                }
                            })
                            .catch(error => console.error('Error en fetch al asignar:', error));

                        assignMenu.classList.remove('visible');
                    }
                });

                // Lógica para eliminar tarea
                const deleteBtn = card.querySelector('.delete-task-btn');
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();

                    if (confirm(`¿Estás seguro de que quieres eliminar la tarea "${task.title}"?`)) {
                        const taskId = card.getAttribute('data-id');

                        fetch('delete_task.php', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ taskId })
                        })
                            .then(response => response.json())
                            .then(data => {
                                if (data.success) {
                                    card.remove();
                                    updateTaskCounts();
                                }
                                else {
                                    alert('Error al eliminar la tarea: ' + data.message);
                                }
                            })
                            .catch(error => console.error('Error en fetch al eliminar:', error));
                    }
                });

                return card;
            }

            function updateTaskCounts() {
                document.querySelectorAll('.board-column').forEach(column => {
                    const count = column.querySelectorAll('.task-card').length;
                    column.querySelector('.task-count').textContent = count;
                });
            }

            function getDragAfterElement(container, y) {
                const draggableElements = [...container.querySelectorAll('.task-card:not(.dragging)')];
                return draggableElements.reduce((closest, child) => {
                    const box = child.getBoundingClientRect();
                    const offset = y - box.top - box.height / 2;
                    if (offset < 0 && offset > closest.offset) {
                        return { offset: offset, element: child };
                    }
                    else {
                        return closest;
                    }
                }, { offset: Number.NEGATIVE_INFINITY }).element;
            }

            fetch('tasks.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok ' + response.statusText);
                    }
                    return response.json();
                })
                .then(tasks => {
                    allTasks = tasks;
                    console.log('Tasks loaded successfully:', allTasks);
                    // Mapeo de estado a columna
                    const statusMap = {
                        'planned': 'planned',
                        'in_progress': 'in_progress',
                        'completed': 'completed',
                        'undefined': 'undefined',
                        'ready': 'ready'
                    };

                    tasks.forEach(task => {
                        const targetStatus = statusMap[task.status] || 'undefined';
                        const column = document.querySelector(`.board-column[data-status="${targetStatus}"] .column-content`);

                        if (column) {
                            const taskCard = createTaskCard(task);
                            column.appendChild(taskCard);
                        }
                    });

                    updateTaskCounts();
                })
                .catch(error => {
                    console.error('Error al cargar las tareas:', error);
                    alert('No se pudieron cargar las tareas. Revisa el archivo tasks.json y la consola para más detalles.');
                });

            // --- Lógica del Modal ---
            addTaskBtn.addEventListener('click', () => {
                createModal.style.display = 'block';
            });

            closeModalBtn.addEventListener('click', () => {
                createModal.style.display = 'none';
            });

            window.addEventListener('click', (event) => {
                if (event.target == createModal) {
                    createModal.style.display = 'none';
                }
            });

            // --- Lógica para Crear Tarea ---
            createTaskForm.addEventListener('submit', (event) => {
                event.preventDefault();
                const taskTitle = document.getElementById('taskTitle').value;
                const taskDeveloper = document.getElementById('taskDeveloper').value;

                fetch('create_task.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        title: taskTitle,
                        developer: taskDeveloper
                    }),
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success && data.task) {
                            // Añadir la nueva tarea al tablero
                            const plannedColumn = document.querySelector('.board-column[data-status="planned"] .column-content');
                            const newTaskCard = createTaskCard(data.task);
                            plannedColumn.appendChild(newTaskCard);
                            updateTaskCounts();

                            // Limpiar y cerrar el modal
                            createTaskForm.reset();
                            createModal.style.display = 'none';
                        }
                        else {
                            alert('Error al crear la tarea: ' + data.message);
                        }
                    })
                    .catch(error => console.error('Error en la petición fetch:', error));
            });

            // --- Lógica del Modal de Detalles ---
            closeDetailsModalBtn.addEventListener('click', () => {
                detailsModal.style.display = 'none';
            });

            window.addEventListener('click', (event) => {
                if (event.target == detailsModal) {
                    detailsModal.style.display = 'none';
                }
            });

            taskDetailsForm.addEventListener('submit', (event) => {
                event.preventDefault();
                const taskId = document.getElementById('detailsTaskId').value;
                const notes = document.getElementById('taskNotes').value;

                fetch('update_task_notes.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ taskId, notes })
                })
                    .then(response => {
                        if (!response.ok) {
                            // Lanza un error si la respuesta del servidor no es exitosa (ej. 404, 500)
                            throw new Error(`Error del servidor: ${response.status} ${response.statusText}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data.success && data.task) {
                            // Actualizar la tarea en el array local
                            const taskIndex = allTasks.findIndex(t => t.id == taskId);
                            if (taskIndex > -1) {
                                allTasks[taskIndex].notes = data.task.notes; // Actualiza solo las notas
                            }

                            // Actualizar la tarjeta en la UI
                            const card = document.querySelector(`.task-card[data-id="${taskId}"]`);
                            if (card) {
                                let notesContainer = card.querySelector('.task-notes');
                                if (data.task.notes) {
                                    const notesHTML = `<i class="fa-solid fa-thumbtack"></i> ${data.task.notes}`;
                                    if (notesContainer) {
                                        notesContainer.innerHTML = notesHTML;
                                    }
                                    else {
                                        // Asegurarse de que el contenedor de notas se añade si no existe
                                        notesContainer = document.createElement('div');
                                        notesContainer.className = 'task-notes';
                                        notesContainer.innerHTML = notesHTML;
                                        card.appendChild(notesContainer);
                                    }
                                }
                                else if (notesContainer) {
                                    // Si las notas están vacías, elimina el contenedor
                                    notesContainer.remove();
                                }
                            }
                            detailsModal.style.display = 'none';
                            console.log('Notas actualizadas exitosamente.', data.task);
                        }
                        else {
                            // Si el backend devuelve success: false
                            throw new Error(data.message || 'El backend indicó un error al actualizar.');
                        }
                    })
                    .catch(error => {
                        console.error('Error detallado al actualizar notas:', error);
                        alert(`No se pudieron guardar las notas. Causa: ${error.message}.\n\nRevisa la consola del navegador (F12) para más detalles.`);
                    });
            });

            // --- Lógica de Arrastrar y Soltar (Drag and Drop) ---
            const columns = document.querySelectorAll('.column-content');

            columns.forEach(column => {
                column.addEventListener('dragover', e => {
                    e.preventDefault();
                    const afterElement = getDragAfterElement(column, e.clientY);
                    const draggable = document.querySelector('.dragging');
                    if (afterElement == null) {
                        column.appendChild(draggable);
                    }
                    else {
                        column.insertBefore(draggable, afterElement);
                    }
                });

                column.addEventListener('drop', e => {
                    e.preventDefault();
                    const draggable = document.querySelector('.dragging');
                    if (!draggable) return;

                    const taskId = draggable.getAttribute('data-id');
                    const newStatus = column.parentElement.getAttribute('data-status');

                    // Llamada al backend para actualizar el estado
                    fetch('update_status.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ taskId: taskId, newStatus: newStatus })
                    })
                        .then(response => response.json())
                        .then(data => {
                            if (!data.success) {
                                console.error('Error al actualizar la tarea:', data.message);
                                // Opcional: revertir el movimiento si falla la actualización
                            }
                        })
                        .catch(error => console.error('Error en fetch al actualizar:', error));

                    updateTaskCounts();
                });
            });
        });
    </script>

</body>

</html>
