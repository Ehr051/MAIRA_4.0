<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Sistema 3D MAIRA - FUNCIONAL</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            color: #00ff00;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }
        
        .status {
            background: #111;
            border: 1px solid #333;
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
        }
        
        .success { border-color: #00ff00; color: #00ff00; }
        .error { border-color: #ff6666; color: #ff6666; }
        .warning { border-color: #ffaa00; color: #ffaa00; }
        
        button {
            background: #333;
            color: #00ff00;
            border: 1px solid #555;
            padding: 15px 30px;
            margin: 10px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #555;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,255,0,0.3);
        }
        
        button:disabled {
            background: #222;
            color: #666;
            cursor: not-allowed;
        }
        
        #canvas {
            border: 2px solid #00ff00;
            border-radius: 10px;
            margin: 20px 0;
            box-shadow: 0 0 20px rgba(0,255,0,0.3);
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        
        .model-card {
            background: #111;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .model-card:hover {
            border-color: #00ff00;
            box-shadow: 0 0 10px rgba(0,255,0,0.2);
        }
        
        .model-status {
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 12px;
            margin: 5px 0;
        }
        
        .status-loading { background: #333; color: #ffaa00; }
        .status-success { background: #004400; color: #00ff00; }
        .status-error { background: #440000; color: #ff6666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Sistema 3D MAIRA 4.0 - FUNCIONAL</h1>
        
        <div class="status warning">
            <h3>⚠️ PROBLEMA IDENTIFICADO</h3>
            <p><strong>Los archivos GLB descargados tienen referencias externas rotas.</strong></p>
            <p>💡 <strong>Solución:</strong> Usar modelos de placeholder hasta conseguir GLB válidos.</p>
        </div>
        
        <div style="text-align: center;">
            <button onclick="iniciarSistema3D()" id="btnIniciar">🚀 Iniciar Sistema 3D</button>
            <button onclick="crearEscenaConPlaceholders()" id="btnPlaceholders">📦 Crear Escena con Placeholders</button>
            <button onclick="testearUnModelo()" id="btnTest">🔍 Test Individual</button>
            <button onclick="limpiarEscena()" id="btnLimpiar">🧹 Limpiar</button>
        </div>
        
        <canvas id="canvas" width="800" height="400" style="display:none;"></canvas>
        
        <div id="status"></div>
        
        <div class="grid" id="modelGrid" style="display:none;">
            <!-- Los modelos se llenarán aquí -->
        </div>
    </div>

    <!-- Three.js - SOLO UNA VEZ -->
    <script src="Client/Libs/three/three.min.js"></script>
    <script src="Client/Libs/three/GLTFLoader.js"></script>
    <script src="Client/Libs/three/OrbitControlsBrowser.js"></script>

    <script>
        // Variables globales
        let scene, camera, renderer, controls;
        let sistemIniciado = false;
        
        // Lista de modelos MAIRA
        const modelosMAIRA = [
            { nombre: 'TAM Tank', archivo: 'tam_tank.glb', tipo: 'Tanque', color: 0x4a4a4a },
            { nombre: 'TAM 2C', archivo: 'tam_2c_tank.glb', tipo: 'Tanque', color: 0x5a5a5a },
            { nombre: 'SK105', archivo: 'sk105.glb', tipo: 'Cañón Autopropulsado', color: 0x3a3a3a },
            { nombre: 'M113 APC', archivo: 'm113_apc.glb', tipo: 'Transporte', color: 0x6a4a2a },
            { nombre: 'Humvee', archivo: 'humvee.glb', tipo: 'Vehículo', color: 0x4a6a2a },
            { nombre: 'Soldado Rifle', archivo: 'soldier_rifle.glb', tipo: 'Infantería', color: 0x2a6a4a },
            { nombre: 'Soldado AT', archivo: 'soldier_antitank.glb', tipo: 'Infantería', color: 0x2a6a6a },
            { nombre: 'Artillería', archivo: 'artillery_cannon.glb', tipo: 'Artillería', color: 0x6a2a2a }
        ];

        function log(mensaje, tipo = 'info') {
            const statusDiv = document.getElementById('status');
            const timestamp = new Date().toLocaleTimeString();
            const colorClass = tipo === 'error' ? 'error' : tipo === 'warning' ? 'warning' : 'success';
            
            statusDiv.innerHTML += `<div class="status ${colorClass}">
                [${timestamp}] ${mensaje}
            </div>`;
            
            // Mantener solo los últimos 10 mensajes
            const messages = statusDiv.children;
            if (messages.length > 10) {
                statusDiv.removeChild(messages[0]);
            }
            
            statusDiv.scrollTop = statusDiv.scrollHeight;
        }

        function iniciarSistema3D() {
            if (sistemIniciado) {
                log('Sistema ya iniciado', 'warning');
                return;
            }

            log('🚀 Inicializando Sistema 3D MAIRA...', 'info');
            
            try {
                // Verificar Three.js
                if (!window.THREE) {
                    throw new Error('THREE.js no está disponible');
                }
                
                const canvas = document.getElementById('canvas');
                canvas.style.display = 'block';
                
                // Crear escena
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x001122);
                
                // Crear cámara
                camera = new THREE.PerspectiveCamera(75, canvas.width / canvas.height, 0.1, 1000);
                camera.position.set(10, 8, 10);
                
                // Crear renderer
                renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
                renderer.setSize(canvas.width, canvas.height);
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                
                // Iluminación
                const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
                scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(20, 20, 10);
                directionalLight.castShadow = true;
                directionalLight.shadow.mapSize.width = 2048;
                directionalLight.shadow.mapSize.height = 2048;
                scene.add(directionalLight);
                
                // Suelo
                const planeGeometry = new THREE.PlaneGeometry(50, 50);
                const planeMaterial = new THREE.MeshLambertMaterial({ color: 0x2a4a2a });
                const plane = new THREE.Mesh(planeGeometry, planeMaterial);
                plane.rotation.x = -Math.PI / 2;
                plane.receiveShadow = true;
                scene.add(plane);
                
                // Controles
                if (window.THREE.OrbitControls) {
                    controls = new THREE.OrbitControls(camera, renderer.domElement);
                    controls.enableDamping = true;
                    controls.dampingFactor = 0.05;
                }
                
                // Animación
                function animate() {
                    requestAnimationFrame(animate);
                    if (controls) controls.update();
                    renderer.render(scene, camera);
                }
                animate();
                
                sistemIniciado = true;
                log('✅ Sistema 3D iniciado correctamente', 'success');
                
                // Habilitar botones
                document.getElementById('btnPlaceholders').disabled = false;
                document.getElementById('btnTest').disabled = false;
                document.getElementById('btnLimpiar').disabled = false;
                
            } catch (error) {
                log(`❌ Error iniciando sistema: ${error.message}`, 'error');
            }
        }

        function crearEscenaConPlaceholders() {
            if (!sistemIniciado) {
                log('⚠️ Inicia el sistema 3D primero', 'warning');
                return;
            }
            
            log('📦 Creando escena con placeholders...', 'info');
            
            // Limpiar modelos existentes
            const objetosAEliminar = [];
            scene.traverse(function(child) {
                if (child.isMesh && child.name.startsWith('modelo_')) {
                    objetosAEliminar.push(child);
                }
            });
            
            objetosAEliminar.forEach(objeto => scene.remove(objeto));
            
            // Crear placeholders para cada modelo
            modelosMAIRA.forEach((modelo, index) => {
                const fila = Math.floor(index / 4);
                const columna = index % 4;
                
                // Crear geometría según tipo
                let geometry;
                switch (modelo.tipo) {
                    case 'Tanque':
                        geometry = new THREE.BoxGeometry(3, 1.5, 2);
                        break;
                    case 'Vehículo':
                    case 'Transporte':
                        geometry = new THREE.BoxGeometry(2.5, 1.2, 1.8);
                        break;
                    case 'Infantería':
                        geometry = new THREE.CapsuleGeometry(0.3, 1.5, 4, 8);
                        break;
                    case 'Artillería':
                        geometry = new THREE.CylinderGeometry(0.2, 0.5, 2, 8);
                        break;
                    default:
                        geometry = new THREE.BoxGeometry(2, 1, 2);
                }
                
                const material = new THREE.MeshPhongMaterial({ 
                    color: modelo.color,
                    transparent: true,
                    opacity: 0.8
                });
                
                const placeholder = new THREE.Mesh(geometry, material);
                placeholder.position.set(
                    (columna - 1.5) * 5,
                    modelo.tipo === 'Infantería' ? 0.75 : 0.75,
                    (fila - 1) * 5
                );
                
                placeholder.castShadow = true;
                placeholder.receiveShadow = true;
                placeholder.name = `modelo_${modelo.nombre.replace(/\s+/g, '_')}`;
                
                scene.add(placeholder);
                
                log(`📦 ${modelo.nombre} - Placeholder creado`, 'success');
            });
            
            log('✅ Escena con placeholders completada', 'success');
            mostrarGridModelos();
        }

        function mostrarGridModelos() {
            const grid = document.getElementById('modelGrid');
            grid.style.display = 'grid';
            grid.innerHTML = '';
            
            modelosMAIRA.forEach(modelo => {
                const card = document.createElement('div');
                card.className = 'model-card';
                card.innerHTML = `
                    <h4>${modelo.nombre}</h4>
                    <p><strong>Tipo:</strong> ${modelo.tipo}</p>
                    <p><strong>Archivo:</strong> ${modelo.archivo}</p>
                    <div class="model-status status-success">✅ Placeholder Activo</div>
                    <button onclick="enfocarModelo('${modelo.nombre}')">🎯 Enfocar</button>
                `;
                grid.appendChild(card);
            });
        }

        function enfocarModelo(nombreModelo) {
            if (!scene || !camera || !controls) return;
            
            const nombreObjeto = `modelo_${nombreModelo.replace(/\s+/g, '_')}`;
            const objeto = scene.getObjectByName(nombreObjeto);
            
            if (objeto) {
                const position = objeto.position.clone();
                camera.position.set(position.x + 5, position.y + 3, position.z + 5);
                if (controls) {
                    controls.target.copy(position);
                    controls.update();
                }
                log(`🎯 Enfocando ${nombreModelo}`, 'success');
            }
        }

        function testearUnModelo() {
            if (!sistemIniciado) {
                log('⚠️ Inicia el sistema 3D primero', 'warning');
                return;
            }
            
            log('🔍 Probando carga de un modelo real...', 'info');
            
            const loader = new THREE.GLTFLoader();
            loader.load(
                'Client/assets/models/tam_tank.glb',
                function(gltf) {
                    log('🎉 ¡MODELO REAL CARGADO EXITOSAMENTE!', 'success');
                    log('Este modelo SÍ funciona - problema solucionado', 'success');
                    
                    if (gltf.scene && gltf.scene.isObject3D) {
                        gltf.scene.position.set(0, 0, -8);
                        gltf.scene.scale.setScalar(0.5);
                        scene.add(gltf.scene);
                    }
                },
                function(progress) {
                    const percent = Math.round((progress.loaded / progress.total) * 100);
                    if (percent % 25 === 0) {
                        log(`⏳ Cargando: ${percent}%`, 'info');
                    }
                },
                function(error) {
                    log(`❌ Confirmado: ${error.message}`, 'error');
                    log('💡 Solución: Reemplazar archivos GLB con versiones válidas', 'warning');
                }
            );
        }

        function limpiarEscena() {
            if (scene) {
                // Remover todos los modelos
                const objetosAEliminar = [];
                scene.traverse(function(child) {
                    if (child.isMesh && child.name.startsWith('modelo_')) {
                        objetosAEliminar.push(child);
                    }
                });
                
                objetosAEliminar.forEach(objeto => scene.remove(objeto));
                log('🧹 Escena limpiada', 'success');
            }
            
            document.getElementById('modelGrid').style.display = 'none';
        }

        // Log inicial
        log('🎮 Sistema 3D MAIRA 4.0 cargado y listo', 'success');
        log('💡 Presiona "Iniciar Sistema 3D" para comenzar', 'info');
    </script>
</body>
</html>
