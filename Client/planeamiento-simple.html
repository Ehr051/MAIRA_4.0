<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAIRA - Planeamiento Militar</title>
    
    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="image/favicon_logoai/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="image/favicon_logoai/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="image/favicon_logoai/favicon-16x16.png">
    <link rel="manifest" href="image/favicon_logoai/site.webmanifest">
    
    <!-- 🎯 CSS CRÍTICOS DIRECTOS -->
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/node_modules/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="/node_modules/leaflet/dist/leaflet.css">
    <link rel="stylesheet" href="/node_modules/leaflet-draw/dist/leaflet.draw.css">
    <link rel="stylesheet" href="/node_modules/leaflet-control-geocoder/dist/Control.Geocoder.css">
    <link rel="stylesheet" href="/node_modules/@raruto/leaflet-elevation/dist/leaflet-elevation.css">
    <link rel="stylesheet" href="/node_modules/leaflet-fullscreen/dist/leaflet.fullscreen.css">
    <link rel="stylesheet" href="/node_modules/leaflet-sidebar-v2/css/leaflet-sidebar.min.css">
    <link rel="stylesheet" href="/node_modules/leaflet-measure/dist/leaflet-measure.css">
    <link rel="stylesheet" href="/node_modules/leaflet-easybutton/src/easy-button.css">
    
    <!-- CSS MAIRA Personalizados -->
    <link rel="stylesheet" href="css/common/planeamiento.css">
    <link rel="stylesheet" href="css/common/CYGMarcha.css">
    <link rel="stylesheet" href="css/common/graficomarcha.css">
    <link rel="stylesheet" href="css/common/test-buttons.css">
    
    <!-- 🚀 JAVASCRIPT CRÍTICOS EN ORDEN -->
    <!-- Básicos -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.8.0/proj4.js"></script>
    
    <!-- Leaflet y extensiones -->
    <script src="/node_modules/leaflet/dist/leaflet.js"></script>
    <script src="/node_modules/milsymbol/dist/milsymbol.js"></script>
    <script src="/node_modules/leaflet-draw/dist/leaflet.draw.js"></script>
    <script src="/node_modules/leaflet-control-geocoder/dist/Control.Geocoder.min.js"></script>
    <script src="/node_modules/@raruto/leaflet-elevation/dist/leaflet-elevation.min.js"></script>
    <script src="/node_modules/leaflet-fullscreen/dist/Leaflet.fullscreen.min.js"></script>
    <script src="/node_modules/leaflet-sidebar-v2/js/leaflet-sidebar.min.js"></script>
    <script src="/node_modules/leaflet-measure/dist/leaflet-measure.js"></script>
    <script src="/node_modules/leaflet-easybutton/src/easy-button.js"></script>
    
    <!-- 🎯 CONFIGURACIÓN MAIRA MÍNIMA -->
    <script>
        // Configuración global MAIRA
        window.MAIRA = {
            config: {
                SERVER_URL: window.location.origin,
                CLIENT_URL: window.location.origin,
                MODULE: 'planeamiento'
            },
            map: null,
            markers: [],
            drawings: []
        };
        
        // Variables globales esenciales
        let map;
        let marcadores = [];
        let calcos = [];
        
        console.log('🎯 MAIRA Planeamiento - Configuración básica lista');
    </script>
</head>
<body class="maira-planeamiento">

<div id="botones-principales">
  <div class="menu-btn">
    <button id="verBtn" onclick="toggleMenu('ver-menu')">
      <i class="fas fa-eye"></i> Ver
    </button>
    <div id="ver-menu" class="menu collapse">
      <a href="#" onclick="toggleLayer('satellite')">Vista Satélite</a>
      <a href="#" onclick="toggleLayer('terrain')">Terreno</a>
      <a href="#" onclick="toggleGrid()">Grilla MGRS</a>
    </div>
  </div>
  
  <div class="menu-btn">
    <button id="herramientasBtn" onclick="toggleMenu('herramientas-menu')">
      <i class="fas fa-tools"></i> Herramientas
    </button>
    <div id="herramientas-menu" class="menu collapse">
      <a href="#" onclick="activateMeasureTool()">Medir Distancia</a>
      <a href="#" onclick="activateDrawTool()">Dibujar</a>
      <a href="#" onclick="showElevationProfile()">Perfil Elevación</a>
    </div>
  </div>
  
  <div class="menu-btn"> 
    <button onclick="toggleMenu('agregar-menu')">
      <i class="fas fa-plus"></i> Agregar Elemento
    </button>
    <div id="agregar-menu" class="menu collapse">
      <div class="botones-fuerza">
        <a href="#" onclick="agregarUnidad('infanteria')">Infantería</a>
        <a href="#" onclick="agregarUnidad('blindados')">Blindados</a>
        <a href="#" onclick="agregarUnidad('artilleria')">Artillería</a>
      </div>
    </div>
  </div>
</div>

<main>
  <div id="mapContainer">
    <div id="map" style="height: 100vh; width: 100%;"></div>
  </div>
  
  <div id="coordenadas" class="coordenadas-display"></div>
  
  <!-- Controles básicos -->
  <div id="botones-secundarios">
    <button onclick="centrarMapa()"><i class="fas fa-crosshairs"></i></button>
    <button onclick="limpiarMapa()"><i class="fas fa-eraser"></i></button>
    <button onclick="exportarMapa()"><i class="fas fa-download"></i></button>
  </div>
</main>

<!-- 📦 FUNCIONES BÁSICAS DE PLANEAMIENTO -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    console.log('🎯 Inicializando MAIRA Planeamiento...');
    
    try {
        // Inicializar mapa base
        initializeMap();
        
        // Configurar herramientas básicas
        setupBasicTools();
        
        console.log('✅ MAIRA Planeamiento inicializado correctamente');
        
    } catch (error) {
        console.error('❌ Error inicializando planeamiento:', error);
    }
});

function initializeMap() {
    // Configuración básica del mapa
    map = L.map('map', {
        center: [-34.6118, -58.3960], // Buenos Aires por defecto
        zoom: 8,
        zoomControl: true
    });
    
    // Capa base
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 18
    }).addTo(map);
    
    // Event listeners básicos
    map.on('click', function(e) {
        updateCoordinates(e.latlng);
    });
    
    map.on('mousemove', function(e) {
        updateCoordinates(e.latlng);
    });
    
    window.MAIRA.map = map;
    console.log('✅ Mapa base inicializado');
}

function updateCoordinates(latlng) {
    const coords = document.getElementById('coordenadas');
    if (coords) {
        coords.innerHTML = `Lat: ${latlng.lat.toFixed(6)}, Lng: ${latlng.lng.toFixed(6)}`;
    }
}

function setupBasicTools() {
    // Configurar herramientas básicas de dibujo
    if (typeof L.Control.Draw !== 'undefined') {
        const drawControl = new L.Control.Draw({
            position: 'topleft',
            draw: {
                polygon: true,
                polyline: true,
                rectangle: true,
                circle: true,
                marker: true
            }
        });
        map.addControl(drawControl);
        
        map.on(L.Draw.Event.CREATED, function(e) {
            const layer = e.layer;
            map.addLayer(layer);
            window.MAIRA.drawings.push(layer);
            console.log('➕ Elemento dibujado agregado');
        });
    }
    
    console.log('✅ Herramientas básicas configuradas');
}

// Funciones básicas de menú
function toggleMenu(menuId) {
    const menu = document.getElementById(menuId);
    if (menu) {
        menu.classList.toggle('show');
    }
}

function agregarUnidad(tipo) {
    if (!map) return;
    
    const center = map.getCenter();
    const marker = L.marker([center.lat, center.lng], {
        title: `Unidad ${tipo}`
    }).addTo(map);
    
    marker.bindPopup(`<b>Unidad de ${tipo}</b><br>Click para editar`);
    window.MAIRA.markers.push(marker);
    
    console.log(`✅ Unidad ${tipo} agregada`);
}

function activateMeasureTool() {
    console.log('📏 Herramienta de medición activada');
    // Implementar medición básica
}

function activateDrawTool() {
    console.log('✏️ Herramienta de dibujo activada');
    // Implementar dibujo básico
}

function centrarMapa() {
    if (map) {
        map.setView([-34.6118, -58.3960], 8);
        console.log('🎯 Mapa centrado');
    }
}

function limpiarMapa() {
    if (map) {
        // Limpiar marcadores
        window.MAIRA.markers.forEach(marker => map.removeLayer(marker));
        window.MAIRA.markers = [];
        
        // Limpiar dibujos
        window.MAIRA.drawings.forEach(drawing => map.removeLayer(drawing));
        window.MAIRA.drawings = [];
        
        console.log('🧹 Mapa limpiado');
    }
}

function exportarMapa() {
    console.log('💾 Exportando mapa...');
    // Implementar exportación básica
}

function toggleLayer(layerType) {
    console.log(`🗺️ Alternando capa: ${layerType}`);
    // Implementar cambio de capas
}

function toggleGrid() {
    console.log('🔲 Alternando grilla MGRS');
    // Implementar grilla
}

function showElevationProfile() {
    console.log('📈 Mostrando perfil de elevación');
    // Implementar perfil básico
}

console.log('🎯 MAIRA Planeamiento - Scripts básicos cargados');
</script>

</body>
</html>
