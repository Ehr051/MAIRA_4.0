      </div>
      <div class="loading-text" id="loadingText">Cargando recursos...</div>
    </div>
    <div class="version">Versión 1.4.1 - DEBUG MODE</div>

  <!-- ✅ INICIALIZACIÓN SIMPLE y LIMPIA -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
        console.log('🚀 MAIRA 4.0 - Juego de Guerra (DEBUG MODE - Scripts Comentados)');
        console.log('🔍 Scripts comentados: gestorJuego.js, gestorMapa.js, sistema3DIntegrado.js, indexP.js, inicializadorJuegoGuerra.js');
        
        // Solo verificar que el sistema esté limpio después de la inicialización
        setTimeout(function() {
            console.log('🧹 Sistema iniciado limpio - Sin elementos automáticos');
            
            // Verificar estado del mapa
            if (typeof window.mapa !== 'undefined') {
                console.log('✅ Mapa principal inicializado:', window.mapa.getCenter());
                console.log('🔍 Tipo de mapa:', typeof window.mapa);
                console.log('🔍 ID del contenedor:', window.mapa.getContainer().id);
            } else {
                console.warn('⚠️ Mapa no encontrado');
            }
            
            // Verificar si hay otros mapas
            console.log('🔍 Verificando mapas duplicados...');
            if (typeof window.map !== 'undefined') {
                console.error('❌ ENCONTRADO MAPA DUPLICADO: window.map existe!');
                console.log('🔍 Tipo de window.map:', typeof window.map);
                if (window.map && window.map.getContainer) {
                    console.log('🔍 ID del contenedor de window.map:', window.map.getContainer().id);
                }
            } else {
                console.log('✅ No se detectó window.map - CORRECTO');
            }
            
            // Verificar funcionalidades básicas
            if (typeof window.sistemaZoom !== 'undefined') {
                console.log('✅ Sistema de zoom disponible');
            }
            
            console.log('✅ MAIRA 4.0 DEBUG MODE listo para usar');
        }, 2000);
    });
  </script>
